plugins {
    id 'java'
    id 'application'
}

group = 'org.crayon'
version = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Corrected JNativeHook dependency
    implementation 'com.github.kwhat:jnativehook:2.2.2'
    implementation 'com.formdev:flatlaf:3.5.4'

    // Testing dependencies
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.crayon.Main'
}

// Target Java 17 so the jar runs on any Java 17+ install, whichever JDK builds it.
// UTF-8 keeps the ◄ ► ° characters intact when compiling on Windows.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes('Main-Class': 'org.crayon.Main')
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}